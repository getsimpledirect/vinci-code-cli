name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    # PR #1 (`vinci` -> `main`) is the permanently-open fork-layer PR; it is never going to merge, so
    # running upstream's CI against it produces a red check on every push to trunk forever. A check
    # that is always red trains everyone to ignore it, which is how a real failure gets missed.
    # Trunk's own gates are `vinci-tests` and `PR Gate`.
    if: github.event_name != 'pull_request' || github.head_ref != 'vinci'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test
