name: vinci-holdout-benchmark

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Agent under test"
        required: true
        default: "vinci"
        type: choice
        options: [vinci, codex, claude]
      campaign_id:
        description: "Stable holdout campaign slug"
        required: true
        type: string
      repetition:
        description: "Clean repetition number"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]

permissions: {}

concurrency:
  group: vinci-repo-benchmark
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.VINCI_EC2_TEST_REGION || 'ca-central-1' }}
      AWS_ROLE_ARN: ${{ vars.VINCI_EC2_TEST_ROLE_ARN }}
      ARTIFACT_BUCKET: ${{ vars.VINCI_EC2_TEST_BUCKET }}
      AUTO_SCALING_GROUP: ${{ vars.VINCI_EC2_TEST_ASG }}
      TASK_BUNDLE_KEY: ${{ vars.VINCI_HOLDOUT_TASK_BUNDLE_KEY }}
      TASK_BUNDLE_SHA256: ${{ vars.VINCI_HOLDOUT_TASK_BUNDLE_SHA256 }}
      VERIFIER_BUNDLE_KEY: ${{ vars.VINCI_HOLDOUT_VERIFIER_BUNDLE_KEY }}
      VERIFIER_BUNDLE_SHA256: ${{ vars.VINCI_HOLDOUT_VERIFIER_BUNDLE_SHA256 }}
      RUN_KEY: holdout-${{ github.run_id }}-${{ github.run_attempt }}
      PROVIDER: ${{ inputs.provider }}
      MODEL: ${{ inputs.provider == 'vinci' && 'forte' || 'default' }}
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      REPETITION: ${{ inputs.repetition }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate holdout configuration
        run: |
          set -euo pipefail
          : "${AWS_ROLE_ARN:?Set VINCI_EC2_TEST_ROLE_ARN}"
          : "${ARTIFACT_BUCKET:?Set VINCI_EC2_TEST_BUCKET}"
          : "${AUTO_SCALING_GROUP:?Set VINCI_EC2_TEST_ASG}"
          : "${TASK_BUNDLE_KEY:?Set VINCI_HOLDOUT_TASK_BUNDLE_KEY}"
          : "${VERIFIER_BUNDLE_KEY:?Set VINCI_HOLDOUT_VERIFIER_BUNDLE_KEY}"
          [[ "${PROVIDER}" =~ ^(vinci|codex|claude)$ ]]
          [[ "${MODEL}" =~ ^(forte|default)$ ]]
          [[ "${CAMPAIGN_ID}" =~ ^[a-z0-9][a-z0-9-]{2,60}$ ]]
          [[ "${REPETITION}" =~ ^[1-3]$ ]]
          [[ "${TASK_BUNDLE_KEY}" =~ ^holdout/[A-Za-z0-9._/-]+\.tgz$ ]]
          [[ "${VERIFIER_BUNDLE_KEY}" =~ ^holdout/[A-Za-z0-9._/-]+\.tgz$ ]]
          [[ "${TASK_BUNDLE_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          [[ "${VERIFIER_BUNDLE_SHA256}" =~ ^[a-f0-9]{64}$ ]]

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: vinci-holdout-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 10800

      - name: Remove a stale runner
        run: |
          set -euo pipefail
          aws autoscaling set-desired-capacity --auto-scaling-group-name "${AUTO_SCALING_GROUP}" --desired-capacity 0
          for _ in $(seq 1 60); do
            instances="$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "${AUTO_SCALING_GROUP}" --query 'AutoScalingGroups[0].Instances[].InstanceId' --output text)"
            [[ -z "${instances}" || "${instances}" == "None" ]] && exit 0
            sleep 5
          done
          exit 1

      - name: Stage source and credential
        env:
          VINCI_KEY: ${{ secrets.VINCI_EC2_TEST_API_KEY }}
          CODEX_KEY: ${{ secrets.VINCI_BENCHMARK_OPENAI_API_KEY }}
          CLAUDE_KEY: ${{ secrets.VINCI_BENCHMARK_ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          COPYFILE_DISABLE=1 tar --exclude=.git --exclude=node_modules --exclude='*/node_modules' --exclude=dist --exclude='*/dist' --exclude=vinci-test-artifacts -czf /tmp/vinci-source.tgz .
          case "${PROVIDER}" in
            vinci) key="${VINCI_KEY}" ;;
            codex) key="${CODEX_KEY}" ;;
            claude) key="${CLAUDE_KEY}" ;;
          esac
          : "${key:?Set the dedicated benchmark secret for ${PROVIDER}}"
          umask 077
          printf '%s' "${key}" >/tmp/vinci-holdout-key
          aws s3 cp /tmp/vinci-source.tgz "s3://${ARTIFACT_BUCKET}/runs/${RUN_KEY}/source.tgz" --only-show-errors
          aws s3 cp /tmp/vinci-holdout-key "s3://${ARTIFACT_BUCKET}/runs/${RUN_KEY}/credential" --only-show-errors
          rm -f /tmp/vinci-holdout-key

      - name: Start disposable runner
        run: |
          set -euo pipefail
          aws autoscaling set-desired-capacity --auto-scaling-group-name "${AUTO_SCALING_GROUP}" --desired-capacity 1
          for _ in $(seq 1 60); do
            instance_id="$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "${AUTO_SCALING_GROUP}" --query 'AutoScalingGroups[0].Instances[0].InstanceId' --output text)"
            if [[ -n "${instance_id}" && "${instance_id}" != "None" ]]; then
              echo "INSTANCE_ID=${instance_id}" >>"${GITHUB_ENV}"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Wait for Systems Manager
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            status="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=${INSTANCE_ID}" --query 'InstanceInformationList[0].PingStatus' --output text)"
            [[ "${status}" == "Online" ]] && exit 0
            sleep 5
          done
          exit 1

      - name: Run private holdout
        run: |
          set -euo pipefail
          mkdir -p artifacts
          source_uri="s3://${ARTIFACT_BUCKET}/runs/${RUN_KEY}/source.tgz"
          credential_uri="s3://${ARTIFACT_BUCKET}/runs/${RUN_KEY}/credential"
          result_uri="s3://${ARTIFACT_BUCKET}/runs/${RUN_KEY}/results.tgz"
          evidence_uri="s3://${ARTIFACT_BUCKET}/evidence/${CAMPAIGN_ID}/${PROVIDER}/${REPETITION}/holdout-results.tgz"
          task_uri="s3://${ARTIFACT_BUCKET}/${TASK_BUNDLE_KEY}"
          verifier_uri="s3://${ARTIFACT_BUCKET}/${VERIFIER_BUNDLE_KEY}"
          remote_command="$(printf '%s\n' \
            'set -euo pipefail' \
            'for attempt in $(seq 1 120); do [[ -f /var/lib/vinci-runner/ready ]] && break; sleep 5; done' \
            '[[ -f /var/lib/vinci-runner/ready ]] || exit 70' \
            'rm -rf /home/vinci/run && install -d -o vinci -g vinci -m 0755 /home/vinci/run' \
            "aws s3 cp '${source_uri}' /tmp/vinci-source.tgz --only-show-errors" \
            'tar -C /home/vinci/run -xzf /tmp/vinci-source.tgz && chown -R vinci:vinci /home/vinci/run' \
            "bash /home/vinci/run/vinci/test/ec2/holdout-remote-run.sh '${result_uri}' '${credential_uri}' '${PROVIDER}' '${MODEL}' '${CAMPAIGN_ID}' '${REPETITION}' '${task_uri}' '${TASK_BUNDLE_SHA256}' '${verifier_uri}' '${VERIFIER_BUNDLE_SHA256}' '${evidence_uri}' '/home/vinci/run'")"
          jq -n --arg command "${remote_command}" '{commands: [$command]}' >ssm-parameters.json
          command_id="$(aws ssm send-command --instance-ids "${INSTANCE_ID}" --document-name AWS-RunShellScript --timeout-seconds 9000 --parameters file://ssm-parameters.json --query 'Command.CommandId' --output text)"
          status=Pending
          for _ in $(seq 1 900); do
            status="$(aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}" --query Status --output text 2>/dev/null || echo Pending)"
            case "${status}" in Success|Cancelled|TimedOut|Failed|Cancelling) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}" >artifacts/ssm-command.json || true
          if [[ "${status}" != "Success" ]]; then
            echo "::error::Private holdout ended with Systems Manager status ${status}."
            jq -r '.StandardErrorContent // empty' artifacts/ssm-command.json
            exit 1
          fi

      - name: Download sanitized results
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p artifacts/raw artifacts/sanitized
          if aws s3 cp "s3://${ARTIFACT_BUCKET}/runs/${RUN_KEY}/results.tgz" /tmp/vinci-holdout-results.tgz --only-show-errors; then
            tar -C artifacts/raw -xzf /tmp/vinci-holdout-results.tgz
            find artifacts/raw -type f \( -name metrics.json -o -name summary.json -o -name hidden-verification.json \) -print0 | while IFS= read -r -d '' file; do
              relative="${file#artifacts/raw/}"
              mkdir -p "artifacts/sanitized/$(dirname "${relative}")"
              jq 'walk(if type == "object" then del(.finalText, .adapter) else . end)' "${file}" >"artifacts/sanitized/${relative}"
            done
            cp artifacts/raw/environment.txt artifacts/sanitized/environment.txt 2>/dev/null || true
          else
            echo "Remote holdout results were unavailable." >artifacts/sanitized/no-results.txt
          fi
          if [[ -f artifacts/ssm-command.json ]]; then
            jq '{Status, StatusDetails, ResponseCode}' artifacts/ssm-command.json >artifacts/sanitized/ssm-status.json
          fi

      - name: Remove runner and staging objects
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          aws autoscaling set-desired-capacity --auto-scaling-group-name "${AUTO_SCALING_GROUP}" --desired-capacity 0
          aws s3 rm "s3://${ARTIFACT_BUCKET}/runs/${RUN_KEY}/" --recursive --only-show-errors

      - name: Upload sanitized holdout metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vinci-holdout-${{ inputs.campaign_id }}-${{ inputs.provider }}-${{ inputs.repetition }}
          path: artifacts/sanitized/
          if-no-files-found: error
          retention-days: 30
